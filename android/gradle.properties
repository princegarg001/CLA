## Kept modest deliberately: this machine has ~7.7GB total RAM. -Xmx8G here
## (the previous setting) asked a SINGLE Gradle daemon for more heap than the
## whole machine has, and org.gradle.parallel's default spins up several
## workers at once — together that thrashed the system into swapping and
## turned a ~2min build into 20+ min. 1.5G/worker x a capped worker count
## fits comfortably instead.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=true
android.useAndroidX=true
